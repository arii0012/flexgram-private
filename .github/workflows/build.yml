name: Build FlexGram

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  build-android:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || echo "Gradle build requires full Android SDK in CI - see README"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            dist
          if-no-files-found: warn

  build-desktop:
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Electron
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist-electron/**/*.exe
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-desktop]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FlexGram v${{ github.run_number }}
          draft: true
          files: |
            artifacts/**/*.apk
            artifacts/**/*.exe
            artifacts/web-dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
